name: Diagnose Pages provisioning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect Pages provisioning response
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "GET /pages"
            gh api "repos/${GITHUB_REPOSITORY}/pages"
            echo "POST /pages"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          } > PAGES_DIAGNOSTIC.txt 2>&1
      - name: Record diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAGES_DIAGNOSTIC.txt
          git commit -m "Record Pages provisioning diagnostic"
          git push origin HEAD:master